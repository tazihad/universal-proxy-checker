<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Globe / Network Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Glowing Proxy Connection Nodes -->
  <circle cx="256" cy="96" r="12" fill="#ffffff" filter="url(#glow)" />
  <circle cx="416" cy="256" r="12" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="416" r="12" fill="#ffffff" filter="url(#glow)" />
  <circle cx="96" cy="256" r="12" fill="#ffffff" filter="url(#glow)" />

  <!-- Central Shield Emblem -->
  <path d="M256,128 L352,176 V264 C352,328 310,384 256,400 C202,384 160,328 160,264 V176 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="10" 
        stroke-linejoin="round" />

  <!-- Speed Lightning Bolt in Shield -->
  <path d="M266,170 L216,260 H260 L246,330 L296,240 H252 Z" 
        fill="#4f46e5" 
        stroke="#4f46e5" 
        stroke-width="4" 
        stroke-linejoin="round" />
</svg>
